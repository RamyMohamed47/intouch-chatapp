name: intouch

services:
  mongo:
    image: mongo:8.0.29-noble
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - intouch-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host 127.0.0.1 --port 27017 --quiet --eval '
          if (db.hello().isWritablePrimary) { quit(0); }
          try { rs.status(); }
          catch (error) {
            if (error.code === 94 || error.codeName === "NotYetInitialized") {
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            }
          }
          quit(1);'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.2.9-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - intouch-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0
    command:
      - --smtp-auth-accept-any
      - --smtp-auth-allow-insecure
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  intouch-mongo-data:
  intouch-redis-data:
