
openapi: 3.1.0

info:
  title: InTouch REST API
  version: 1.0.0
  description: |
    REST API for InTouch.

    InTouch is a multi-tenant real-time communication platform inspired by
    Discord, Slack, and WhatsApp.

    This specification documents the HTTP API only.
    Real-time communication is documented separately under Socket.IO.

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development

tags:
  - name: Authentication
  - name: Users
  - name: Organizations
  - name: Memberships
  - name: Categories
  - name: Conversations
  - name: Messages

security:
  - bearerAuth: []

paths:

  #
  # Authentication
  #

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      description: |
        Password login is protected by independent per-IP and per-account
        attempt limits. The first ten account attempts within fifteen minutes
        are admitted. Further attempts receive a generic 429 response during a
        non-extending fifteen-minute cooldown.
      security: []
      requestBody:
        $ref: "#/components/requestBodies/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/oauth/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth authentication
      security: []
      responses:
        "302":
          $ref: "#/components/responses/GoogleOAuthStartRedirect"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/oauth/google/callback:
    get:
      tags: [Authentication]
      summary: Complete Google OAuth authentication
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/GoogleOAuthCallbackRedirect"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/RefreshCsrfHeader"
      responses:
        "200":
          $ref: "#/components/responses/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh session
      description: |
        Idempotently revokes the refresh session identified by the refresh
        cookie and clears that cookie. No request body is accepted.
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/RefreshCsrfHeader"
      responses:
        "204":
          description: Session revoked or already absent; refresh cookie cleared
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  #
  # Organizations
  #

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations for current user
      responses:
        "200":
          $ref: "#/components/responses/OrganizationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Organizations]
      summary: Create organization
      requestBody:
        $ref: "#/components/requestBodies/CreateOrganizationRequest"
      responses:
        "201":
          $ref: "#/components/responses/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get organization
      parameters:
        - $ref: "#/components/parameters/OrganizationResourceId"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Organizations]
      summary: Update organization
      parameters:
        - $ref: "#/components/parameters/OrganizationResourceId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateOrganizationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Organizations]
      summary: Delete organization
      parameters:
        - $ref: "#/components/parameters/OrganizationResourceId"
      responses:
        "204":
          description: Organization deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  #
  # Memberships
  #

  /organizations/{id}/invitations:
    post:
      tags: [Memberships]
      summary: Invite a registered user
      parameters:
        - $ref: "#/components/parameters/OrganizationResourceId"
      requestBody:
        $ref: "#/components/requestBodies/InviteMemberRequest"
      responses:
        "201":
          $ref: "#/components/responses/InvitationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{id}/join:
    post:
      tags: [Memberships]
      summary: Join a public organization
      parameters:
        - $ref: "#/components/parameters/OrganizationResourceId"
      responses:
        "201":
          $ref: "#/components/responses/MembershipResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /invitations:
    get:
      tags: [Memberships]
      summary: List current user's pending invitations
      responses:
        "200":
          $ref: "#/components/responses/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /invitations/{invitationId}/accept:
    post:
      tags: [Memberships]
      summary: Accept a pending invitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "201":
          $ref: "#/components/responses/MembershipResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /invitations/{invitationId}:
    delete:
      tags: [Memberships]
      summary: Decline a pending invitation
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Invitation declined
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  #
  # Categories
  #

  /organizations/{organizationId}/categories:
    get:
      tags: [Categories]
      summary: List categories
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          $ref: "#/components/responses/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Categories]
      summary: Create category
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        $ref: "#/components/requestBodies/CreateCategoryRequest"
      responses:
        "201":
          $ref: "#/components/responses/CategoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/categories/{categoryId}:
    patch:
      tags: [Categories]
      summary: Update category
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCategoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/CategoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [Categories]
      summary: Delete category
      description: A category containing channels cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/members:
    get:
      tags: [Memberships]
      summary: List organization members and current presence
      description: Available to every current organization member.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationMemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  #
  # Conversations
  #

  /organizations/{organizationId}/conversations:
    get:
      tags: [Conversations]
      summary: List channel conversations
      description: Returns accessible channels with last-message, unread-count, and caller read-state summaries. Direct messages are listed separately.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: categoryId
          in: query
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "200":
          $ref: "#/components/responses/ConversationListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Conversations]
      summary: Create channel conversation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        $ref: "#/components/requestBodies/CreateConversationRequest"
      responses:
        "201":
          $ref: "#/components/responses/ConversationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}/direct-messages:
    get:
      tags: [Conversations]
      summary: List the caller's direct messages in an organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: before
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          $ref: "#/components/responses/DirectMessageListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      summary: Create or retrieve a one-to-one direct message
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectMessageInput"
      responses:
        "200":
          description: Existing direct message returned
          content:
            application/json:
              schema:
                type: object
                required: [directMessage]
                properties:
                  directMessage:
                    $ref: "#/components/schemas/DirectConversation"
        "201":
          description: Direct message created
          content:
            application/json:
              schema:
                type: object
                required: [directMessage]
                properties:
                  directMessage:
                    $ref: "#/components/schemas/DirectConversation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: Get conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          $ref: "#/components/responses/ConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Conversations]
      summary: Update conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateConversationRequest"
      responses:
        "200":
          $ref: "#/components/responses/ConversationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [Conversations]
      summary: Delete conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Conversation and dependent records deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{conversationId}/participants:
    get:
      tags: [Conversations]
      summary: List private-channel participants
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          $ref: "#/components/responses/ParticipantListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [Conversations]
      summary: Add a private-channel participant
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        $ref: "#/components/requestBodies/AddParticipantRequest"
      responses:
        "201":
          $ref: "#/components/responses/ParticipantResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /conversations/{conversationId}/participants/{userId}:
    delete:
      tags: [Conversations]
      summary: Remove a private-channel participant
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Participant removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /conversations/{conversationId}/read-receipt:
    put:
      tags: [Messages]
      summary: Advance the caller's conversation read state
      description: The high-water mark is monotonic. Direct-message updates are broadcast; channel read state remains private.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadReceiptInput"
      responses:
        "200":
          $ref: "#/components/responses/ReadReceiptResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  #
  # Messages
  #

  /conversations/{conversationId}/messages:
    get:
      tags: [Messages]
      summary: Get message history
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: before
          in: query
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          $ref: "#/components/responses/MessageListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Messages]
      summary: Create message
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        $ref: "#/components/requestBodies/CreateMessageRequest"
      responses:
        "201":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /messages/{messageId}:
    patch:
      tags: [Messages]
      summary: Edit message
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateMessageRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags: [Messages]
      summary: Delete message
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message redacted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-intouch_refresh

    googleOAuthStateCookie:
      type: apiKey
      in: cookie
      name: __Secure-intouch_google_oauth_state

  parameters:

    OrganizationResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    RefreshCsrfHeader:
      name: X-CSRF-Protection
      in: header
      required: true
      schema:
        type: string
        const: "1"

    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string

    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

  requestBodies:

    RegisterRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterInput"

    LoginRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginInput"

    CreateOrganizationRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateOrganizationInput"

    UpdateOrganizationRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateOrganizationInput"

    InviteMemberRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InviteMemberInput"

    CreateCategoryRequest:
      description: Defined by the shared category contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateCategoryInput"

    UpdateCategoryRequest:
      description: Defined by the shared category contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateCategoryInput"

    CreateConversationRequest:
      description: Defined by the shared conversation contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateConversationInput"

    UpdateConversationRequest:
      description: Defined by the shared conversation contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateConversationInput"

    AddParticipantRequest:
      description: Defined by the shared conversation contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddParticipantInput"

    CreateMessageRequest:
      description: Defined by the shared message contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageContentInput"

    UpdateMessageRequest:
      description: Defined by the shared message contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageContentInput"

  responses:

    AuthResponse:
      description: Authentication completed and refresh cookie set.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthPayload"

    AccessTokenResponse:
      description: Access token refreshed and refresh cookie rotated.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessTokenPayload"

    GoogleOAuthStartRedirect:
      description: OAuth state cookie set and browser redirected to Google.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
        Set-Cookie:
          required: true
          schema:
            type: string

    GoogleOAuthCallbackRedirect:
      description: |
        Browser redirected to the configured frontend callback with
        googleAuth=success or googleAuth=failed. Successful authentication also
        sets the InTouch refresh cookie. No access or refresh token is placed in
        the redirect URL.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
        Set-Cookie:
          required: true
          schema:
            type: string

    UserResponse:
      description: User returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user:
                $ref: "#/components/schemas/PublicUser"

    LoginResponse:
      $ref: "#/components/responses/AuthResponse"

    OrganizationResponse:
      description: Organization returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [organization]
            properties:
              organization:
                $ref: "#/components/schemas/PublicOrganization"

    OrganizationListResponse:
      description: List of organizations.
      content:
        application/json:
          schema:
            type: object
            required: [organizations]
            properties:
              organizations:
                type: array
                items:
                  $ref: "#/components/schemas/PublicOrganization"

    MembershipResponse:
      description: Membership returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [membership]
            properties:
              membership:
                $ref: "#/components/schemas/Membership"

    InvitationResponse:
      description: Invitation returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [invitation]
            properties:
              invitation:
                $ref: "#/components/schemas/Invitation"

    InvitationListResponse:
      description: List of pending invitations.
      content:
        application/json:
          schema:
            type: object
            required: [invitations]
            properties:
              invitations:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"

    CategoryResponse:
      description: Category returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [category]
            properties:
              category:
                $ref: "#/components/schemas/Category"

    CategoryListResponse:
      description: Ordered category list.
      content:
        application/json:
          schema:
            type: object
            required: [categories]
            properties:
              categories:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    ConversationResponse:
      description: Conversation returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [conversation]
            properties:
              conversation:
                $ref: "#/components/schemas/Conversation"

    ConversationListResponse:
      description: Accessible conversation list.
      content:
        application/json:
          schema:
            type: object
            required: [conversations]
            properties:
              conversations:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

    DirectMessageListResponse:
      description: Cursor-paginated direct-message list.
      content:
        application/json:
          schema:
            type: object
            required: [directMessages, nextCursor]
            properties:
              directMessages:
                type: array
                items:
                  $ref: "#/components/schemas/DirectConversation"
              nextCursor:
                oneOf:
                  - type: string
                  - type: "null"

    ReadReceiptResponse:
      description: Current monotonic conversation read state.
      content:
        application/json:
          schema:
            type: object
            required: [readReceipt]
            properties:
              readReceipt:
                $ref: "#/components/schemas/ReadReceipt"

    OrganizationMemberListResponse:
      description: Organization member list.
      content:
        application/json:
          schema:
            type: object
            required: [members]
            properties:
              members:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"

    ParticipantResponse:
      description: Conversation participant returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [participant]
            properties:
              participant:
                $ref: "#/components/schemas/ConversationParticipant"

    ParticipantListResponse:
      description: Private-channel participant list.
      content:
        application/json:
          schema:
            type: object
            required: [participants]
            properties:
              participants:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationParticipantView"

    MessageResponse:
      description: Message returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                $ref: "#/components/schemas/Message"

    MessageListResponse:
      description: Cursor-paginated message history, newest first.
      content:
        application/json:
          schema:
            type: object
            required: [messages, nextCursor]
            properties:
              messages:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
              nextCursor:
                oneOf:
                  - type: string
                  - type: "null"

    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: A request limit was exceeded.
      headers:
        Retry-After:
          description: Seconds until the authenticated action may be retried. Authentication limits may omit this header.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: An upstream authentication provider is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    CreateCategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"

    UpdateCategoryInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
        position:
          type: integer
          minimum: 0

    Category:
      type: object
      required: [id, organizationId, name, position, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        position:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateConversationInput:
      type: object
      additionalProperties: false
      required: [categoryId, name]
      properties:
        categoryId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
          default: PUBLIC

    UpdateConversationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        position:
          type: integer
          minimum: 0

    CreateDirectMessageInput:
      type: object
      additionalProperties: false
      required: [recipientUserId]
      properties:
        recipientUserId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"

    UpdateReadReceiptInput:
      type: object
      additionalProperties: false
      required: [messageId]
      properties:
        messageId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"

    Conversation:
      oneOf:
        - $ref: "#/components/schemas/ChannelConversation"
        - $ref: "#/components/schemas/DirectConversation"
      discriminator:
        propertyName: type

    ChannelConversation:
      type: object
      required:
        [id, organizationId, categoryId, name, type, visibility, position, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        categoryId:
          type: string
        name:
          type: string
        type:
          type: string
          const: CHANNEL
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
        position:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
        readReceipt:
          oneOf:
            - $ref: "#/components/schemas/ReadReceipt"
            - type: "null"

    DirectConversation:
      type: object
      required:
        [id, organizationId, type, peer, lastMessage, unreadCount, readReceipt, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        type:
          type: string
          const: DIRECT
        peer:
          $ref: "#/components/schemas/PeerUser"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
        readReceipt:
          oneOf:
            - $ref: "#/components/schemas/ReadReceipt"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddParticipantInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"

    ConversationParticipant:
      type: object
      required:
        [id, organizationId, conversationId, userId, addedByUserId, joinedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        conversationId:
          type: string
        userId:
          type: string
        addedByUserId:
          type: string
        joinedAt:
          type: string
          format: date-time

    ConversationParticipantView:
      allOf:
        - $ref: "#/components/schemas/ConversationParticipant"
        - type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/ParticipantUser"

    ParticipantUser:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri

    MemberUser:
      type: object
      required: [id, username, displayName, status, lastSeenAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        lastSeenAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    PeerUser:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri

    OrganizationMember:
      type: object
      required: [membershipId, role, joinedAt, user]
      properties:
        membershipId:
          type: string
        role:
          type: string
          enum: [OWNER, MEMBER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/MemberUser"

    MessageContentInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: ".*\\S.*"

    Message:
      type: object
      required:
        [id, conversationId, senderId, content, messageType, editedAt, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        content:
          oneOf:
            - type: string
            - type: "null"
        messageType:
          type: string
          const: TEXT
        editedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        deletedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReadReceipt:
      type: object
      required: [id, conversationId, userId, lastReadMessageId, lastReadAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        userId:
          type: string
        lastReadMessageId:
          type: string
        lastReadAt:
          type: string
          format: date-time

    InviteMemberInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    Membership:
      type: object
      required: [id, userId, organizationId, role, joinedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        organizationId:
          type: string
        role:
          type: string
          enum: [OWNER, MEMBER]
        joinedAt:
          type: string
          format: date-time

    InvitationOrganizationSummary:
      type: object
      required: [id, name, slug, visibility]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
          format: uri
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]

    Invitation:
      type: object
      required:
        - id
        - organizationId
        - invitedUserId
        - invitedByUserId
        - expiresAt
        - createdAt
        - organization
      properties:
        id:
          type: string
        organizationId:
          type: string
        invitedUserId:
          type: string
        invitedByUserId:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        organization:
          $ref: "#/components/schemas/InvitationOrganizationSummary"

    CreateOrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
        logoUrl:
          type: string
          format: uri
          pattern: "^https?://"
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]
          default: PRIVATE

    UpdateOrganizationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
        logoUrl:
          oneOf:
            - type: string
              format: uri
              pattern: "^https?://"
            - type: "null"
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]

    PublicOrganization:
      type: object
      required:
        [id, name, slug, visibility, currentUserRole, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
          format: uri
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]
        currentUserRole:
          oneOf:
            - type: string
              enum: [OWNER, MEMBER]
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterInput:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true

    PublicUser:
      type: object
      required: [id, username, displayName, email, createdAt, updatedAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthPayload:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        accessToken:
          type: string

    AccessTokenPayload:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - TOO_MANY_REQUESTS
                - SERVICE_UNAVAILABLE
                - INTERNAL_SERVER_ERROR
            message:
              type: string
