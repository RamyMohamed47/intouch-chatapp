
openapi: 3.1.0

info:
  title: InTouch REST API
  version: 1.0.0
  description: |
    REST API for InTouch.

    InTouch is a multi-tenant real-time communication platform inspired by
    Discord, Slack, and WhatsApp.

    This specification documents the HTTP API only.
    Real-time communication is documented separately under Socket.IO.

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development

tags:
  - name: Authentication
  - name: Users
  - name: Organizations
  - name: Memberships
  - name: Categories
  - name: Conversations
  - name: Messages

security:
  - bearerAuth: []

paths:

  #
  # Authentication
  #

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      security: []
      requestBody:
        $ref: "#/components/requestBodies/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/oauth/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth authentication
      security: []
      responses:
        "302":
          $ref: "#/components/responses/GoogleOAuthStartRedirect"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/oauth/google/callback:
    get:
      tags: [Authentication]
      summary: Complete Google OAuth authentication
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/GoogleOAuthCallbackRedirect"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/RefreshCsrfHeader"
      responses:
        "200":
          $ref: "#/components/responses/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  #
  # Organizations
  #

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations for current user
      responses:
        "200":
          $ref: "#/components/responses/OrganizationListResponse"

    post:
      tags: [Organizations]
      summary: Create organization
      requestBody:
        $ref: "#/components/requestBodies/CreateOrganizationRequest"
      responses:
        "201":
          $ref: "#/components/responses/OrganizationResponse"

  /organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Get organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationResponse"

    patch:
      tags: [Organizations]
      summary: Update organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateOrganizationRequest"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationResponse"

    delete:
      tags: [Organizations]
      summary: Delete organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204":
          description: Organization deleted

  #
  # Memberships
  #

  /organizations/{organizationId}/members:
    get:
      tags: [Memberships]
      summary: List organization members
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          $ref: "#/components/responses/MembershipListResponse"

    post:
      tags: [Memberships]
      summary: Invite or add member
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        $ref: "#/components/requestBodies/AddMemberRequest"
      responses:
        "201":
          $ref: "#/components/responses/MembershipResponse"

  /organizations/{organizationId}/members/{memberId}:
    delete:
      tags: [Memberships]
      summary: Remove member
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Member removed

  #
  # Categories
  #

  /organizations/{organizationId}/categories:
    get:
      tags: [Categories]
      summary: List categories

    post:
      tags: [Categories]
      summary: Create category

  /organizations/{organizationId}/categories/{categoryId}:
    patch:
      tags: [Categories]
      summary: Update category

    delete:
      tags: [Categories]
      summary: Delete category

  #
  # Conversations
  #

  /organizations/{organizationId}/conversations:
    get:
      tags: [Conversations]
      summary: List conversations

    post:
      tags: [Conversations]
      summary: Create conversation

  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: Get conversation

    patch:
      tags: [Conversations]
      summary: Update conversation

    delete:
      tags: [Conversations]
      summary: Delete conversation

  #
  # Messages
  #

  /conversations/{conversationId}/messages:
    get:
      tags: [Messages]
      summary: Get message history

    post:
      tags: [Messages]
      summary: Create message

  /messages/{messageId}:
    patch:
      tags: [Messages]
      summary: Edit message

    delete:
      tags: [Messages]
      summary: Delete message

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-intouch_refresh

    googleOAuthStateCookie:
      type: apiKey
      in: cookie
      name: __Secure-intouch_google_oauth_state

  parameters:

    RefreshCsrfHeader:
      name: X-CSRF-Protection
      in: header
      required: true
      schema:
        type: string
        const: "1"

    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string

    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string

    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string

  requestBodies:

    RegisterRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterInput"

    LoginRequest:
      description: Defined by shared Zod contract.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginInput"

    CreateOrganizationRequest:
      description: Defined by shared Zod contract.

    UpdateOrganizationRequest:
      description: Defined by shared Zod contract.

    AddMemberRequest:
      description: Defined by shared Zod contract.

  responses:

    AuthResponse:
      description: Authentication completed and refresh cookie set.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthPayload"

    AccessTokenResponse:
      description: Access token refreshed and refresh cookie rotated.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessTokenPayload"

    GoogleOAuthStartRedirect:
      description: OAuth state cookie set and browser redirected to Google.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
        Set-Cookie:
          required: true
          schema:
            type: string

    GoogleOAuthCallbackRedirect:
      description: |
        Browser redirected to the configured frontend callback with
        googleAuth=success or googleAuth=failed. Successful authentication also
        sets the InTouch refresh cookie. No access or refresh token is placed in
        the redirect URL.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
        Set-Cookie:
          required: true
          schema:
            type: string

    UserResponse:
      description: User returned successfully.
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user:
                $ref: "#/components/schemas/PublicUser"

    LoginResponse:
      $ref: "#/components/responses/AuthResponse"

    OrganizationResponse:
      description: Organization returned successfully.

    OrganizationListResponse:
      description: List of organizations.

    MembershipResponse:
      description: Membership returned successfully.

    MembershipListResponse:
      description: List of memberships.

    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Authentication rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    RegisterInput:
      type: object
      additionalProperties: false
      required: [username, displayName, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true

    PublicUser:
      type: object
      required: [id, username, displayName, email, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthPayload:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        accessToken:
          type: string

    AccessTokenPayload:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
            message:
              type: string
